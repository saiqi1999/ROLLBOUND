name: Build and deploy ROLLBOUND
on:
  push:
    branches: [main]
    paths: ['web/**', 'Assets/Game/Art/**', '.github/workflows/rollbound-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rollbound-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PLAYTEST_RUNS_URL: "${{ vars.ROLLBOUND_PLAYTEST_RUNS_URL || 'https://rollbound.cardinal-99.workers.dev/api/lineup-runs' }}"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify lineup collector
        continue-on-error: true
        run: |
          origin='https://saiqi1999.github.io'
          headers=$(mktemp)
          preflight_status=$(curl --proto '=https' --silent --show-error --max-time 12 \
            --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
            --request OPTIONS --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' "$VITE_PLAYTEST_RUNS_URL")
          printf 'Lineup collector preflight HTTP %s\n' "$preflight_status"
          test "$preflight_status" = 204
          tr -d '\r' < "$headers" | grep -Fxi "access-control-allow-origin: $origin"
          validation_status=$(curl --proto '=https' --silent --show-error --max-time 12 \
            --output /dev/null --write-out '%{http_code}' --header "Origin: $origin" \
            --header 'Content-Type: application/json' --data '{}' "$VITE_PLAYTEST_RUNS_URL")
          printf 'Lineup collector validation HTTP %s\n' "$validation_status"
          test "$validation_status" = 400
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: playable-site
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: playable-site
          path: built
      - name: Publish static files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch built/.nojekyll
          rsync -a --checksum --delete --exclude='.git/' built/ published/
          cmp built/index.html published/index.html
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish web build for ${GITHUB_SHA}"
            git -C published push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
