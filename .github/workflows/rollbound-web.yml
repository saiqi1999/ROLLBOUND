name: Build and deploy ROLLBOUND
on:
  push:
    branches: [main]
    paths: ['web/**', 'Assets/Game/Art/**', '.github/workflows/rollbound-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rollbound-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: playable-site
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: playable-site
          path: built
      - name: Publish static files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch built/.nojekyll
          rsync -a --checksum --delete --exclude='.git/' built/ published/
          cmp built/index.html published/index.html
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish web build for ${GITHUB_SHA}"
            git -C published push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
